# How the p-SWAMP stack runs when started from this project:
#
#   uv run --project ../p-swamp pswamp dev server --extra-modules . -f compose.override.yml
#
# It is added after p-SWAMP's own compose files (its docker-compose.override.yml
# included, if it has one), and a relative path here is relative to THIS folder.
#
# The grid: PSWAMP_CIM_PATH is a folder of CGMES *_<PROFILE>.xml files INSIDE the
# server's container, so mount it. Only the server reads it; it loads it into
# Oxigraph, where everything else reads it. Oxigraph keeps a grid it already holds:
# after changing the grid, take the stack down first
# (docker compose -p p-swamp down --remove-orphans).
#
# This loads the modified Nordic44 grid in grids/nordic44. For another grid, change
# both the path and the mount:
#
#   services:
#     server:
#       environment:
#         PSWAMP_CIM_PATH: /grids/my-grid
#       volumes:
#         - ./grids/my-grid:/grids/my-grid:ro
#
# The sample grid ships in the image, so it needs no mount:
#         PSWAMP_CIM_PATH: /workspace/p-SWAMP/core/src/pswamp_core/cim/sample_grid

services:
  server:
    environment:
      PSWAMP_CIM_PATH: /grids/nordic44
    volumes:
      - ./grids/nordic44:/grids/nordic44:ro
